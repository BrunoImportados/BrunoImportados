<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<title>VIALLUX — Criar Templates Brevo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding: 30px; }
  h1 { color: #FFD700; margin-bottom: 6px; }
  p { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
  .card { background: #1e293b; border-radius: 10px; padding: 24px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155;
          color: #fff; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
  button { background: #FFD700; color: #1a1a1a; border: none; padding: 14px 32px;
           border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; }
  button:hover { background: #f5d000; }
  button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .log { margin-top: 24px; background: #0f172a; border-radius: 8px; padding: 16px;
         font-family: monospace; font-size: 13px; min-height: 120px; max-height: 300px; overflow-y: auto; }
  .ok { color: #4ade80; } .err { color: #f87171; } .info { color: #60a5fa; }
</style>
</head>
<body>

<h1>⚡ VIALLUX — Criar Templates Brevo</h1>
<p>Cria automaticamente os 4 templates de email no teu Brevo com 1 clique.</p>

<div class="card">
  <label>Chave API Brevo</label>
  <input type="text" id="apiKey" value="" placeholder="xkeysib-..." />
  <label>Email remetente (verificado no Brevo)</label>
  <input type="text" id="senderEmail" value="eletricistaslisboa@gmail.com" />
  <label>Nome remetente</label>
  <input type="text" id="senderName" value="VIALLUX Instalações Elétricas" />
  <button id="btnCreate" onclick="createAll()">🚀 Criar os 4 Templates Agora</button>
</div>

<div class="log" id="log"><span class="info">Pronto. Clica no botão para criar os templates.</span></div>

<script>
const PHONE = '912 273 834';
const CONTACT_EMAIL = 'eletricistaslisboa@gmail.com';
const WEBSITE = 'https://www.vialluxinstalacoes.com';
const DOMAIN = 'vialluxinstalacoes.com';

function footer() {
  return `
  <div style="background:#1F4E79;padding:20px 28px;text-align:center;border-top:3px solid #FFD700;">
    <p style="color:#fff;margin:0 0 10px;font-size:14px;font-weight:bold;">⚡ VIALLUX Instalações Elétricas</p>
    <table style="margin:0 auto;border-collapse:collapse;">
      <tr>
        <td style="padding:4px 12px;color:#cce;font-size:13px;">📞 <a href="tel:+351912273834" style="color:#FFD700;text-decoration:none;font-weight:bold;">${PHONE}</a></td>
        <td style="padding:4px 12px;color:#cce;font-size:13px;">✉️ <a href="mailto:${CONTACT_EMAIL}" style="color:#FFD700;text-decoration:none;">${CONTACT_EMAIL}</a></td>
        <td style="padding:4px 12px;color:#cce;font-size:13px;">🌐 <a href="${WEBSITE}" style="color:#FFD700;text-decoration:none;">${DOMAIN}</a></td>
      </tr>
    </table>
  </div>
  <div style="background:#f5f5f5;padding:12px 28px;font-size:11px;color:#aaa;text-align:center;">
    VIALLUX Instalações Elétricas Lda · Lisboa, Portugal<br/>
    <a href="{{unsubscribeUrl}}" style="color:#bbb;">Cancelar subscrição</a>
  </div>`;
}

function header() {
  return `<div style="background:#1F4E79;padding:24px;text-align:center;">
    <h1 style="color:#FFD700;margin:0;font-size:24px;letter-spacing:1px;">⚡ VIALLUX</h1>
    <p style="color:#cce;margin:6px 0 0;font-size:13px;">Instalações Elétricas · Lisboa</p>
  </div>`;
}

function cta(label) {
  return `<div style="text-align:center;margin:32px 0;">
    <a href="tel:+351912273834" style="background:#FFD700;color:#1a1a1a;padding:14px 28px;text-decoration:none;border-radius:6px;font-weight:bold;font-size:15px;margin-right:10px;display:inline-block;margin-bottom:8px;">📞 ${PHONE}</a>
    <a href="mailto:${CONTACT_EMAIL}" style="background:#1F4E79;color:#fff;padding:14px 28px;text-decoration:none;border-radius:6px;font-weight:bold;font-size:15px;display:inline-block;margin-bottom:8px;">📩 ${label}</a>
  </div>`;
}

const TEMPLATES = [
  {
    name: 'VIALLUX — Condomínios',
    subject: 'Parceria Elétrica para Condomínios em Lisboa — VIALLUX',
    html: `<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;color:#1a1a1a;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;">${header()}<div style="padding:32px 28px;"><p style="font-size:16px;margin-top:0;">Olá <strong>{{params.nome}}</strong>,</p><p>A <strong>VIALLUX Instalações Elétricas</strong> é especializada em serviços elétricos para condomínios em Lisboa — desde manutenção preventiva a intervenções urgentes.</p><p><strong>O que garantimos ao seu condomínio:</strong></p><ul style="padding-left:20px;line-height:2.2;"><li>✅ Manutenção preventiva das zonas comuns, elevadores e garagem</li><li>✅ Inspeções ERSE e certificações obrigatórias</li><li>✅ Resposta a urgências em menos de 2 horas</li><li>✅ Instalação de carregadores EV nos lugares de garagem</li><li>✅ Relatórios mensais de manutenção</li></ul><p>Envio proposta personalizada em 24h — sem compromisso.</p>${cta('Solicitar Proposta')}</div>${footer()}</div>`
  },
  {
    name: 'VIALLUX — Hotéis',
    subject: 'Manutenção Elétrica para Hotéis em Lisboa — VIALLUX',
    html: `<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;color:#1a1a1a;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;">${header()}<div style="padding:32px 28px;"><p style="font-size:16px;margin-top:0;">Olá <strong>{{params.nome}}</strong>,</p><p>A <strong>VIALLUX Instalações Elétricas</strong> trabalha com hotéis em Lisboa para garantir segurança elétrica total e continuidade operacional.</p><p><strong>Serviços para o seu hotel:</strong></p><ul style="padding-left:20px;line-height:2.2;"><li>⚡ Contratos anuais de manutenção preventiva e corretiva</li><li>⚡ Urgências 24h — respondemos antes de o hóspede reclamar</li><li>⚡ Conformidade legal: ERSE, RTIEBT, certificação anual</li><li>⚡ Instalação de carregadores elétricos (EV) no parking</li><li>⚡ Relatório mensal de intervenções</li></ul><p>Podemos enviar proposta em 24h ou agendar visita técnica gratuita.</p>${cta('Pedir Proposta Gratuita')}</div>${footer()}</div>`
  },
  {
    name: 'VIALLUX — Hostels',
    subject: 'Serviços Elétricos para Hostels em Lisboa — VIALLUX',
    html: `<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;color:#1a1a1a;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;">${header()}<div style="padding:32px 28px;"><p style="font-size:16px;margin-top:0;">Olá <strong>{{params.nome}}</strong>,</p><p>A <strong>VIALLUX Instalações Elétricas</strong> tem experiência em instalações para hostels e alojamento partilhado em Lisboa.</p><p><strong>O que fazemos para o seu hostel:</strong></p><ul style="padding-left:20px;line-height:2.2;"><li>🔌 Instalação de tomadas e carregadores USB em quartos coletivos</li><li>🔌 Iluminação eficiente (LED + sensores de presença)</li><li>🔌 Quadros elétricos e proteções diferenciadas</li><li>🔌 Urgências rápidas entre check-ins</li><li>🔌 Orçamento gratuito e sem compromisso</li></ul>${cta('Contactar Agora')}</div>${footer()}</div>`
  },
  {
    name: 'VIALLUX — Alojamento Local',
    subject: 'Instalações Elétricas para Alojamento Local — VIALLUX Lisboa',
    html: `<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;color:#1a1a1a;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;">${header()}<div style="padding:32px 28px;"><p style="font-size:16px;margin-top:0;">Olá <strong>{{params.nome}}</strong>,</p><p>A <strong>VIALLUX Instalações Elétricas</strong> apoia proprietários de alojamento local em Lisboa com serviços certificados e resposta rápida.</p><p><strong>Serviços mais pedidos:</strong></p><ul style="padding-left:20px;line-height:2.2;"><li>🏠 Certificado de inspeção elétrica (obrigatório ERSE para AL)</li><li>🏠 Instalação de fechaduras smart e intercomunicadores</li><li>🏠 Atualização e proteção do quadro elétrico</li><li>🏠 Urgências entre check-out e check-in</li><li>🏠 Orçamento enviado em 2 horas</li></ul>${cta('Orçamento em 2 Horas')}</div>${footer()}</div>`
  }
];

function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${new Date().toLocaleTimeString()} — ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function createAll() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const senderEmail = document.getElementById('senderEmail').value.trim();
  const senderName = document.getElementById('senderName').value.trim();
  const btn = document.getElementById('btnCreate');

  if (!apiKey) { alert('Introduz a chave API'); return; }

  btn.disabled = true;
  btn.textContent = '⏳ A criar templates...';
  document.getElementById('log').innerHTML = '';

  log('A ligar ao Brevo...', 'info');

  let ok = 0;
  for (const tpl of TEMPLATES) {
    try {
      const payload = {
        templateName: tpl.name,
        subject: tpl.subject,
        htmlContent: tpl.html,
        sender: { name: senderName, email: senderEmail },
        isActive: true,
        replyTo: senderEmail
      };

      const res = await fetch('https://api.brevo.com/v3/smtp/templates', {
        method: 'POST',
        headers: {
          'api-key': apiKey,
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        log(`✅ "${tpl.name}" criado (ID: ${data.id})`, 'ok');
        ok++;
      } else {
        log(`❌ "${tpl.name}" falhou: ${JSON.stringify(data)}`, 'err');
      }
    } catch(e) {
      log(`❌ "${tpl.name}" erro: ${e.message}`, 'err');
    }
    await new Promise(r => setTimeout(r, 800));
  }

  if (ok === TEMPLATES.length) {
    log(`🎉 CONCLUÍDO! ${ok} templates criados no Brevo.`, 'ok');
    log('Vai a: Transactional → Templates para confirmar.', 'info');
    btn.textContent = '✅ Templates Criados!';
    btn.style.background = '#4ade80';
  } else {
    log(`⚠️ ${ok}/${TEMPLATES.length} templates criados.`, 'err');
    btn.disabled = false;
    btn.textContent = '🔄 Tentar Novamente';
  }
}
</script>
</body>
</html>
